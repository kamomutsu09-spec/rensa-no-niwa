<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>連鎖の庭</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 藍染の布に、花札のようなタイルを並べる */
:root{--ai:#1d2a4d;--ai-deep:#131c36;--stitch:rgba(233,221,196,.18);--kinari:#ece0c6;--sumi:#1b1712;--chips:#4fc2a8;--mult:#ef5a3c;--x:#f2b938;--gold:#f2b938;--sub:#a9b3cc;--txt:#f3ead6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--txt);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;overscroll-behavior:none;background:var(--ai)}
body{min-height:100vh;padding:calc(max(env(safe-area-inset-top), 24px) + 16px) calc(env(safe-area-inset-right) + 12px) calc(max(env(safe-area-inset-bottom), 20px) + 26px) calc(env(safe-area-inset-left) + 12px);user-select:none;-webkit-user-select:none;
  background-color:var(--ai);
  background-image:linear-gradient(90deg,transparent 47%,rgba(255,255,255,.035) 47%,rgba(255,255,255,.035) 53%,transparent 53%),linear-gradient(0deg,transparent 47%,rgba(255,255,255,.035) 47%,rgba(255,255,255,.035) 53%,transparent 53%);
  background-size:22px 22px}
#app{width:440px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
html,body{overflow:hidden}
header{display:flex;align-items:center;gap:10px}
header h1{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:24px;margin:0;flex:1;letter-spacing:.06em;color:var(--kinari)}
.iconbtn{background:none;border:1.5px solid var(--kinari);color:var(--kinari);border-radius:3px;min-width:44px;height:38px;padding:0 10px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
.iconbtn:focus-visible,.card:focus-visible,.btn:focus-visible,.choice:focus-visible,.tcard:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#status{display:flex;gap:16px;font-size:13px;color:var(--sub);align-items:baseline}
#status b{color:var(--kinari);font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:17px;margin-left:3px}
#status .tg{margin-left:auto}
#relics{display:flex;gap:6px;flex-wrap:nowrap;height:28px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#relics::-webkit-scrollbar{display:none}
.relic{flex:none;white-space:nowrap}
.relic{background:var(--kinari);color:var(--sumi);border-radius:2px;padding:3px 8px 3px 7px;font-size:12px;font-weight:700;cursor:pointer;border-left:4px solid var(--mult)}
.relic.empty{background:none;color:var(--sub);border:1px dashed var(--stitch);font-weight:500;cursor:default}
#scorebox{position:relative;padding:4px 0 10px;border-bottom:2px solid var(--stitch)}
#eq{display:flex;align-items:flex-end;justify-content:center;gap:12px}
.numwrap{display:flex;flex-direction:column;align-items:center;min-width:110px}
.numwrap small{font-size:12px;color:var(--sub);font-weight:700}
.num{font-family:"Dela Gothic One",sans-serif;font-size:38px;line-height:1.05;text-align:center;transition:transform .08s}
#chips{color:var(--chips)}
#mult{color:var(--mult)}
.op{color:var(--sub);font-size:26px;font-family:"Dela Gothic One",sans-serif;padding-bottom:4px}
#total{font-family:"Dela Gothic One",sans-serif;font-size:30px;text-align:center;margin-top:4px;min-height:40px;color:var(--kinari)}
#total.small{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:15px;color:var(--sub);padding-top:10px}
#total.win{color:var(--gold);font-size:40px}
#total.lose{color:var(--mult)}
#bar{height:3px;background:rgba(0,0,0,.25);margin-top:6px;overflow:hidden}
#barin{height:100%;width:0;background:var(--gold);transition:width .15s}
#bar.gauge{height:14px;border-radius:7px;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1.5px var(--stitch);position:relative;overflow:visible}
#bar.gauge #barin{border-radius:7px;background:linear-gradient(90deg,#8a6a2a,var(--gold));transition:width .25s}
#bar.gauge::after{content:'🎯';position:absolute;right:-6px;top:50%;transform:translateY(-50%);font-size:16px}
#bar.gauge.over #barin{background:linear-gradient(90deg,var(--gold),#fff2b0);box-shadow:0 0 12px rgba(242,185,56,.9)}
#bar.gauge.over{animation:gpulse 1s ease-in-out infinite}
@keyframes gpulse{50%{box-shadow:inset 0 0 0 1.5px var(--gold),0 0 10px rgba(242,185,56,.6)}}
.bump{transform:scale(1.2)}
#combo{will-change:transform;position:absolute;left:0;right:0;top:64px;text-align:center;z-index:6;font-family:"Dela Gothic One",sans-serif;font-size:20px;pointer-events:none;opacity:0;transition:opacity .2s;-webkit-text-stroke:1px rgba(0,0,0,.35)}
#combo.on{opacity:1}
#combo.pump{animation:pump .18s ease-out}
@keyframes pump{0%{transform:scale(1.5)}100%{transform:scale(1)}}
#boardwrap{position:relative}
#board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:18px;background:var(--ai-deep);border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--stitch)}
.cell{aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;position:relative;outline:1.5px dashed var(--stitch);outline-offset:-1.5px;transition:background .15s}
.cell.t{will-change:transform;background:var(--kinari);outline:none;box-shadow:inset 0 0 0 2px var(--sumi),inset 0 0 0 4px var(--kinari),inset 0 0 0 5px rgba(27,23,18,.35),0 2px 0 rgba(0,0,0,.35)}
.cell.can{background:rgba(242,185,56,.12);outline-color:rgba(242,185,56,.7)}
.cell.new{animation:place .25s ease-out}
.cell.fire{animation:fire .22s ease-out}
.cell.fire.x{animation:firex .32s ease-out}
@keyframes place{from{transform:scale(.4) rotate(-10deg)}to{transform:scale(1)}}
@keyframes fire{0%{transform:scale(1)}40%{transform:scale(1.22) translateY(-3px)}100%{transform:scale(1)}}
@keyframes firex{0%{transform:scale(1) rotate(0)}40%{transform:scale(1.4) rotate(-8deg);filter:drop-shadow(0 0 10px var(--x))}100%{transform:scale(1)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:visible}
#fx line{stroke-linecap:round;opacity:0}
@keyframes beam{0%{opacity:0;stroke-dashoffset:var(--len)}20%{opacity:1}60%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
.pop{position:absolute;pointer-events:none;font-family:"Dela Gothic One",sans-serif;font-size:17px;transform:translate(-50%,-50%);opacity:0;will-change:transform,opacity;white-space:nowrap;z-index:5;-webkit-text-stroke:3px var(--sumi);paint-order:stroke fill}
.pop.c{color:var(--chips)}.pop.m{color:var(--mult)}.pop.x{color:var(--x);font-size:24px}.pop.s{color:var(--gold)}.pop.n{color:var(--sub)}
@keyframes pop{0%{opacity:0;margin-top:6px}15%{opacity:1}100%{opacity:0;margin-top:-34px}}
.fly{position:fixed;z-index:25;pointer-events:none;font-family:"Dela Gothic One",sans-serif;font-size:16px;-webkit-text-stroke:3px var(--sumi);paint-order:stroke fill;transform:translate(-50%,-50%);will-change:transform,opacity}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
.flash{animation:flash .6s ease-out}
@keyframes flash{0%{background:rgba(242,185,56,.35)}100%{background:transparent}}
#info{height:62px;overflow-y:auto;font-size:13px;color:var(--sub);line-height:1.6;padding:0 2px;scrollbar-width:none}
#info::-webkit-scrollbar{display:none}
#info b{color:var(--kinari)}
#handrow{display:flex;gap:6px;align-items:flex-end}
#hand{display:flex;gap:8px;flex:1;justify-content:center;min-height:106px;align-items:flex-end}
.card{width:72px;height:100px;background:var(--kinari);color:var(--sumi);border:none;border-radius:4px;box-shadow:inset 0 0 0 2px var(--sumi),inset 0 0 0 4px var(--kinari),inset 0 0 0 5px rgba(27,23,18,.35),0 3px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s;font-family:inherit}
.card:nth-child(1){transform:rotate(-4deg)}.card:nth-child(3){transform:rotate(4deg)}.card:nth-child(4){transform:rotate(7deg)}
.card{position:relative}
.card,.cell,#hold{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.card .tag{position:absolute;top:5px;right:5px;font-size:9px;font-weight:700;line-height:1;padding:2px 3px;border-radius:2px;background:var(--ai);color:var(--kinari)}
.card.t2{background:#e3e7f1}
.card.t3{background:#f6e2a6;box-shadow:inset 0 0 0 2px var(--sumi),inset 0 0 0 4px #f6e2a6,inset 0 0 0 5px rgba(27,23,18,.35),0 3px 0 rgba(0,0,0,.4),0 0 12px rgba(242,185,56,.55)}
.card.only .tag{background:var(--mult);color:#fff7ea}
.card.t3 .tag{background:#b8860b;color:#fff7ea}
.card .e{font-size:34px;line-height:1.2}.card .n{font-size:13px;font-weight:700;margin-top:4px}
.card.sel{transform:translateY(-12px) rotate(0);box-shadow:inset 0 0 0 2px var(--sumi),inset 0 0 0 4px var(--kinari),inset 0 0 0 5px rgba(27,23,18,.35),0 0 0 3px var(--gold),0 8px 0 rgba(0,0,0,.3)}
#side{display:flex;flex-direction:row;gap:8px;align-items:center;width:100%}
#left{font-size:12px;color:var(--sub);text-align:center;width:58px;flex:none;line-height:1.3}
.btn{font-family:inherit;cursor:pointer}
.btn.sub{width:64px;height:64px;background:var(--mult);color:#fff7ea;border:none;border-radius:3px;font-weight:700;font-size:12px;line-height:1.35;box-shadow:inset 0 0 0 2px rgba(255,247,234,.85),inset 0 0 0 4px var(--mult),0 3px 0 rgba(0,0,0,.35)}
.btn:disabled{opacity:.35}
#overlay{position:fixed;inset:0;background:rgba(10,15,32,.78);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
#overlay.show{display:flex}

.st-mvp{display:flex;gap:14px;align-items:center;justify-content:center;background:#f6e2a6;border:2px solid var(--sumi);border-radius:4px;padding:10px;margin:6px 0 10px;box-shadow:0 3px 0 var(--sumi)}
.st-big{font-size:54px;line-height:1}
.st-lbl{font-size:12px;font-weight:700;color:#7a6f5c}.st-name{font-family:"Dela Gothic One",sans-serif;font-size:24px}.st-sub{font-size:12px;color:#4d4538}
.st-line{font-size:13px;margin:4px 2px}.st-flow{font-size:18px;letter-spacing:2px}
.st-list{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.st-row{display:grid;grid-template-columns:20px 34px 1fr auto;gap:6px;align-items:center;background:#fffaf0;border:1.5px solid rgba(27,23,18,.35);border-radius:3px;padding:5px 8px}
.st-row.mvp{border:2px solid var(--mult)}
.st-rank{font-family:"Dela Gothic One",sans-serif;font-size:14px;color:#7a6f5c;text-align:center}
.st-e{font-size:24px;text-align:center}
.st-main b{font-size:14px}.st-main small{display:block;font-size:11px;color:#4d4538;line-height:1.4}
.st-bar{display:block;height:5px;background:rgba(27,23,18,.1);border-radius:3px;margin-top:3px;overflow:hidden}.st-bar span{display:block;height:100%;background:var(--mult)}
.st-pct{font-family:"Dela Gothic One",sans-serif;font-size:16px;min-width:44px;text-align:right}
.st-note{font-size:11px;color:#7a6f5c;line-height:1.6;margin-top:10px}
i.el{font-style:normal;display:inline-block;font-size:9px;font-weight:700;line-height:1;color:#fff;padding:2px 3px;border-radius:2px;margin:0 1px}
.card .els{margin-top:3px;line-height:1}
.cell .els{position:absolute;left:3px;bottom:3px;display:flex;gap:1px;line-height:1}
.cell .els i.el{font-size:8px;padding:1px 2px}
.cell.swapsrc{box-shadow:0 0 0 3px var(--gold) !important}
.cell.swapok{outline:2px dashed var(--gold);outline-offset:-2px}
#hold{width:68px;height:100px;border-radius:4px;border:2px dashed var(--stitch);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sub);font-size:10px;font-weight:700;cursor:pointer;background:none;font-family:inherit;flex:none;padding:0}
#hold.has{border:none;background:var(--kinari);color:var(--sumi);box-shadow:inset 0 0 0 2px var(--sumi),inset 0 0 0 4px var(--kinari),inset 0 0 0 5px rgba(27,23,18,.35),0 3px 0 rgba(0,0,0,.4)}
#hold.sel{box-shadow:inset 0 0 0 2px var(--sumi),0 0 0 3px var(--gold);transform:translateY(-8px)}
#hold.can{border-color:var(--gold);color:var(--gold)}
#hold .e{font-size:26px;line-height:1.2}
#hold .hl{font-size:9px;margin-top:2px}
.btn.sub.mini.undo{background:#5d5444;color:#fff7ea}
.card.shuf{opacity:.55}
.card.shuf::after{content:'配り直し';position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font-size:9px;font-weight:900;background:var(--sumi);color:var(--kinari);padding:1px 4px;border-radius:2px;white-space:nowrap}
.btn.sub.mini{flex:1;width:auto;height:54px;font-size:13px;line-height:1.35;padding:4px 0 0;white-space:nowrap;display:flex;flex-direction:column;align-items:center;justify-content:center}
.btn.sub.alt{background:var(--chips)}
.btn.sub.on{background:var(--gold);color:var(--sumi)}
#factor{display:flex;visibility:hidden;align-items:center;gap:10px;font-size:13px;color:var(--sub);height:26px;overflow:hidden;white-space:nowrap;padding:0 2px}
#factor.on{visibility:visible}
#factor .fk{font-weight:700;color:var(--kinari);background:rgba(236,224,198,.1);border:1px solid var(--stitch);border-radius:3px;padding:1px 8px}
#factor .fv{font-family:"Dela Gothic One",sans-serif;font-size:18px;color:var(--gold);min-width:28px;display:inline-block;transition:transform .08s}
#factor .fs{font-size:11px}
.cell .badge{position:absolute;right:3px;top:3px;font-size:10px;font-weight:700;line-height:1;padding:2px 4px;border-radius:8px;background:var(--sumi);color:var(--kinari)}
.cell .badge.g{background:#c99a00;color:#1b1712}
.cell .badge.p{background:#a0509a;color:#fff}
.cell.axis:not(.t){background:rgba(160,80,154,.12) linear-gradient(90deg,transparent 47%,rgba(160,80,154,.55) 47%,rgba(160,80,154,.55) 53%,transparent 53%)}
.cell.axis.t{box-shadow:inset 0 0 0 2px var(--sumi),inset 0 0 0 4px var(--kinari),inset 0 0 0 5px rgba(27,23,18,.35),0 2px 0 rgba(0,0,0,.35),0 0 0 2px rgba(160,80,154,.8)}
.cell .lvb{position:absolute;left:3px;top:3px;font-size:10px;font-weight:900;line-height:1;padding:2px 4px;border-radius:3px;background:#8a6a45;color:#fff7ea}
.cell.lv{box-shadow:inset 0 0 0 2px var(--sumi),inset 0 0 0 4px var(--kinari),inset 0 0 0 5px rgba(27,23,18,.35),0 2px 0 rgba(0,0,0,.35),0 4px 0 #8a6a45,0 6px 0 rgba(0,0,0,.3)}
.cell.stackok{outline:3px solid var(--gold);outline-offset:1px;cursor:copy;animation:stkp 1s ease-in-out infinite}
@keyframes stkp{50%{transform:translateY(-3px)}}
.cell .stk{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);font-size:10px;font-weight:900;white-space:nowrap;padding:2px 5px;border-radius:3px;background:var(--gold);color:var(--sumi);line-height:1;z-index:2}
.rk-row{display:grid;grid-template-columns:28px auto 1fr;gap:8px;align-items:center;background:#fffaf0;border:1.5px solid rgba(27,23,18,.35);border-radius:3px;padding:6px 8px}
.rk-row.me{border:2px solid var(--mult);background:#fff1dc}
.rk-n{font-family:"Dela Gothic One",sans-serif;font-size:18px;text-align:center}
.rk-n.g1{color:#b8860b}.rk-n.g2{color:#7d8794}.rk-n.g3{color:#a0522d}
.rk-s{font-family:"Dela Gothic One",sans-serif;font-size:17px}
.rk-d{font-size:11px;color:#4d4538;line-height:1.5}
.mini.s{grid-template-columns:repeat(5,9px);gap:1px;padding:2px}.mini.s span{width:9px;height:9px;font-size:7px;line-height:9px}
.rk-me{text-align:center;font-family:"Dela Gothic One",sans-serif;font-size:18px;color:#c23b20;margin:6px 0}
#hov{position:fixed;z-index:45;pointer-events:none;width:220px;background:var(--kinari);color:var(--sumi);border-radius:4px;padding:8px 10px;font-size:12.5px;line-height:1.55;
  box-shadow:inset 0 0 0 2px var(--sumi),0 6px 18px rgba(0,0,0,.5);opacity:0;transform:translateY(4px);transition:opacity .1s,transform .1s}
#hov.on{opacity:1;transform:none}
#hov.t2{background:#e3e7f1}#hov.t3{background:#f6e2a6}
#hov .hh{display:flex;align-items:center;gap:6px;margin-bottom:3px}
#hov .he{font-size:22px;line-height:1}
#hov .hn{font-family:"Dela Gothic One",sans-serif;font-size:15px}
#hov .ht{font-size:10px;font-weight:700;padding:1px 4px;border-radius:2px;background:var(--ai);color:var(--kinari)}
#hov .ht.o{background:var(--mult);color:#fff7ea}
#phase{font-weight:700;color:var(--kinari)}
.cell.act{box-shadow:inset 0 0 0 2px var(--sumi),inset 0 0 0 4px var(--kinari),0 0 0 2px var(--gold) !important}
.cell .ord{position:absolute;left:3px;top:3px;font-size:10px;font-weight:700;line-height:1;padding:2px 4px;border-radius:8px;background:var(--mult);color:#fff7ea}
#fuseline{fill:none;stroke:var(--mult);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 9;opacity:.9}
#board.fusing{touch-action:none}
#board.fusing .cell.t{cursor:crosshair}
.fusebar{display:flex;gap:8px;flex:1;justify-content:center;align-items:center}
.fusebar .btn{height:64px;padding:0 18px;font-size:16px;white-space:nowrap;writing-mode:horizontal-tb}
.fusebar #igniteBtn{flex:1;max-width:220px;font-size:19px}
#coach{position:fixed;z-index:60;width:min(92vw,360px);background:#fffaf0;color:var(--sumi);border:3px solid var(--gold);border-radius:6px;padding:12px 14px 10px;box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:14px;line-height:1.65;display:none}
#coach.on{display:block;animation:coachIn .2s ease-out}
@keyframes coachIn{from{transform:translateY(6px)}to{transform:none}}
#coach .cn{font-size:11px;font-weight:900;color:#a0509a;letter-spacing:.05em}
#coach .cbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
#coach .cbtn button{font-family:inherit;font-weight:700;font-size:13px;border-radius:3px;padding:6px 12px;cursor:pointer;border:2px solid var(--sumi)}
#coach #coachOk{background:var(--sumi);color:var(--kinari)}
#coach #coachSkip{background:transparent;color:#7a6f5c;border-color:transparent}
.coachhl{animation:coachHl 1.1s ease-in-out infinite;outline:3px solid var(--gold);outline-offset:3px;border-radius:4px}
@keyframes coachHl{50%{outline-color:rgba(255,215,90,.2)}}
#status>span{cursor:help}
#status>span:active{opacity:.7}
#factor{cursor:help}
.steps{margin:6px 0 10px;padding-left:0;list-style:none;counter-reset:st}
.steps li{position:relative;padding:6px 0 6px 34px;border-bottom:1px dashed rgba(27,23,18,.2);line-height:1.6}
.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:2px;top:7px;width:22px;height:22px;border-radius:50%;background:var(--sumi);color:var(--kinari);font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center}
.glossary{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13px;line-height:1.55;margin:6px 0}
.glossary dt{font-weight:900;white-space:nowrap}
.glossary dd{margin:0;color:#3d362b}
.tabs.helptabs{flex-wrap:wrap}
.tabs.helptabs button{flex:1 1 30%;white-space:nowrap}
.hsec h3{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:16px;margin:12px 0 4px}
.hsec p{margin:6px 0}
.cell.evo{animation:evo .7s ease-out}
@keyframes evo{0%{transform:scale(.6) rotate(-10deg);filter:brightness(2)}100%{transform:none;filter:none}}
#evo{position:fixed;left:50%;top:14px;transform:translate(-50%,-20px);z-index:42;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;
  background:#1f3a2a;color:#e8f5e4;border:2px solid #7fc48a;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:700;max-width:92vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#evo.on{opacity:1;transform:translate(-50%,0)}
.cell .fc{position:absolute;right:3px;bottom:3px;font-size:10px;font-weight:900;line-height:1;padding:2px 4px;border-radius:3px;background:rgba(27,23,18,.55);color:#fff7ea;pointer-events:none}
.cell .fc.many{background:var(--gold);color:var(--sumi)}

  background:var(--kinari);color:var(--sumi);border-radius:6px;padding:18px 18px 16px;box-shadow:inset 0 0 0 3px var(--sumi),inset 0 0 0 6px var(--kinari),inset 0 0 0 7px rgba(27,23,18,.4),0 12px 40px rgba(0,0,0,.55);text-align:center}

#tip .tels{margin:2px 0 4px}#tip .tels i.el{font-size:13px;padding:3px 7px}

#tip .tg.o{background:var(--mult);color:#fff7ea}
#tip .td{font-size:17px;line-height:1.7;margin-top:8px;font-weight:700}
#tip .tx{font-size:13px;color:#5b5243;margin-top:8px;line-height:1.6}
u.gl,#tip .gls b{text-decoration:none;background:linear-gradient(transparent 58%,rgba(239,90,60,.32) 58%,rgba(239,90,60,.32) 94%,transparent 94%);padding:0 2px;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.setrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.setrow .sbtn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 6px;background:#fffaf0;border:2px solid var(--sumi);border-radius:3px;box-shadow:0 3px 0 var(--sumi);color:var(--sumi);font-family:inherit;cursor:pointer;min-height:64px}
.setrow .sbtn i{font-style:normal;font-size:20px;line-height:1.2}
.setrow .sbtn span{font-size:11px;color:#5b5243;font-weight:500}
.setrow .sbtn b{font-size:13px}
.setrow .sbtn.off{background:#e6dcc7}

.setnote{font-size:11px;color:#5b5243;text-align:center;margin:-2px 0 2px}
#tip .gls{text-align:left;font-size:12.5px;line-height:1.6;margin-top:10px;padding-top:8px;border-top:1px dashed rgba(27,23,18,.35);color:#3d362b;font-weight:400}

#tip .hint{font-size:11px;color:#7a6f5c;margin-top:10px}
.menu{display:flex;flex-direction:column;gap:8px;margin:12px 0 4px}
.menu .choice{text-align:center}
.menu .choice small{display:block;font-size:12px;color:#5b5243;font-weight:500}

.cl-h{font-family:"Dela Gothic One",sans-serif;font-size:15px;margin:14px 0 4px;padding-left:6px;border-left:4px solid var(--mult)}
.cl-h small{font-family:"Zen Kaku Gothic New",sans-serif;font-size:11px;color:#7a6f5c;margin-left:6px}
.cl{display:flex;flex-direction:column;gap:5px}

.tabs{display:flex;gap:6px;margin:4px 0 6px}

.tabs button.on{background:var(--sumi);color:var(--kinari)}
.slot{background:#fffaf0;border:2px solid var(--sumi);border-radius:3px;padding:10px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;box-shadow:0 3px 0 var(--sumi)}
.slot.empty{border-style:dashed;box-shadow:none}
.mini{display:grid;grid-template-columns:repeat(5,15px);gap:2px;background:var(--ai-deep);padding:4px;border-radius:2px}

.mini span.f{background:var(--kinari)}
.slot .sn{font-family:"Dela Gothic One",sans-serif;font-size:15px}
.slot .sd{font-size:12px;line-height:1.55;color:#4d4538}
.slot .sb{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}

.mini.l{grid-template-columns:repeat(5,22px)}.mini.l span{width:22px;height:22px;font-size:15px;line-height:22px}
.slot .score{font-family:"Dela Gothic One",sans-serif;font-size:20px;color:var(--sumi)}

#modal .lead{text-align:center;color:#5b5243}
.choices{display:flex;flex-direction:column;gap:8px;margin:12px 0 4px}

.tcard{position:relative;background:#fffaf0;border:2px solid var(--sumi);border-radius:4px;padding:8px 2px 6px;cursor:pointer;color:var(--sumi);font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 var(--sumi);min-width:0;transition:transform .12s}
.tcard:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sumi)}
.tcard .te{font-size:24px;line-height:1.1;white-space:nowrap}
.tcard .tn{font-family:"Dela Gothic One",sans-serif;font-size:14px;white-space:nowrap}
.tcard .ts{font-size:9.5px;font-weight:700;color:#7a6f5c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tcard .tck{position:absolute;top:-7px;right:-6px;background:var(--gold,#c9a227);color:#1b1712;font-size:11px;font-weight:900;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--sumi)}
.tcard.adv{background:#efe6f4;border-color:#5b3a6e;box-shadow:0 3px 0 #5b3a6e}
.tcard.lockd{opacity:.6;background:#e9e2d2;border-style:dashed;box-shadow:none}
.tcard.on{transform:translateY(-3px);background:#fff3cf;outline:3px solid var(--mult);outline-offset:1px}
.tcard.adv.on{background:#f6ecfb}
.tcard.lockd.on{opacity:.85}
.tdet{margin:10px 0 4px;padding:12px;border:2px solid var(--sumi);border-radius:4px;background:#fffaf0;text-align:left}
.tdet.adv{background:#f6ecfb;border-color:#5b3a6e}
.tdet.lockd{background:#e9e2d2;border-style:dashed}
.tdh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tdh .te{font-size:24px}
.tdh b{font-family:"Dela Gothic One",sans-serif;font-size:18px;font-weight:400}
.tlv{margin-left:auto;font-size:11px;font-weight:700;padding:2px 7px;border-radius:2px;background:rgba(27,23,18,.1)}
.tlv.easy{background:var(--mult);color:#fff}
.tdet p{font-size:13px;line-height:1.6;margin:8px 0;color:#3d362b}
.tdet .tsm{font-size:12px;margin:6px 0 0}
.tfacts{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:11.5px;color:#5d5444}
.tfacts b{color:var(--sumi)}
.tprog{height:8px;background:rgba(27,23,18,.12);border-radius:4px;overflow:hidden}
.tprog span{display:block;height:100%;background:#5b3a6e}
.btn.tgo{display:block;width:100%;margin-top:12px;font-size:16px;font-family:"Dela Gothic One",sans-serif;padding:12px;background:var(--mult);color:#fff7ea;border:none;border-radius:3px;box-shadow:inset 0 0 0 2px rgba(255,247,234,.85),inset 0 0 0 4px var(--mult),0 3px 0 var(--sumi)}
.btn.tgo:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px rgba(255,247,234,.85),inset 0 0 0 4px var(--mult),0 1px 0 var(--sumi)}
.tdet.adv .btn.tgo{background:#5b3a6e;box-shadow:inset 0 0 0 2px rgba(255,247,234,.85),inset 0 0 0 4px #5b3a6e,0 3px 0 var(--sumi)}
@media (max-width:360px){.tcard .tn{font-size:12px}.tcard .te{font-size:17px}.tfacts{grid-template-columns:1fr}}
.textbtn{display:block;margin:10px auto 0;background:none;border:none;font-family:inherit;font-weight:700;font-size:13px;color:var(--sumi);text-decoration:underline;cursor:pointer}
.big{font-family:"Dela Gothic One",sans-serif;font-size:40px;text-align:center;color:var(--sumi);margin:6px 0}
.tilelist{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:13px;margin:8px 0;line-height:1.5}
.burst{position:fixed;pointer-events:none;font-size:26px;z-index:30;animation:burst 1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.card,.card:nth-child(n){transform:none}.shake{animation:none}}
</style>

<body>
<div id="app">
  <header>
    <h1>連鎖の庭</h1>
    <button class="iconbtn" id="soundBtn" aria-label="音の切り替え">音 ON</button>
    <button class="iconbtn" id="menuBtn" aria-label="メニュー">☰ メニュー</button>
  </header>
  <div id="status"><span>ラウンド<b id="round">1</b> / 8</span><span>いのち<b id="lives">🍃🍃🍃</b></span><span>最高<b id="best">-</b></span><span class="tg">目標<b id="target">0</b></span></div>
  <div id="relics"></div>
  <div id="factor"></div>
  <div id="scorebox">
    <div id="eq"><div class="numwrap"><small>点</small><div class="num" id="chips">0</div></div><span class="op">×</span><div class="numwrap"><small>倍率</small><div class="num" id="mult">1</div></div></div>
    <div id="total">0</div><div id="combo"></div>
    <div id="bar"><div id="barin"></div></div>
  </div>
  <div id="boardwrap"><div id="board"></div><svg id="fx"></svg></div>
  <div id="info">タイルを1枚選んで、盤面の空いているマスに置こう。</div>
  <div id="handrow">
    <button id="hold" aria-label="とっておき">とっておき</button>
    <div id="hand"></div>
  </div>
  <div id="side">
    <div id="left"></div>
    <button class="btn sub mini" id="rerollBtn">引き直す</button>
    <button class="btn sub mini undo" id="undoBtn">取り消す</button>
    <button class="btn sub mini alt" id="swapBtn">植え替え</button>
  </div>
</div>
<div id="tip" aria-live="polite"></div>
<div id="coach" role="dialog"></div>
<div id="hov"></div>
<div id="evo"></div>
<div id="mile"></div>
<div id="flashall"></div>
<div id="overlay"><div id="modal"></div></div>
<script>
const N = 5;
const TILES = {
  sprout: { e: '🌱', name: '芽', w: 10, desc: '+3点。隣の💧1つにつき さらに+3点' },
  water:  { e: '💧', name: '水', w: 10, desc: '+2点。隣の🌱1つにつき +1倍' },
  fire:   { e: '🔥', name: '火', w: 8,  desc: '+2倍。隣の🔥1つにつき さらに+2倍' },
  rock:   { e: '🪨', name: '岩', w: 6,  desc: '+8点。隣の🔥1つにつき 熱+2（焼け石。火の塊に混ぜると熱が上がる）' },
  bee:    { e: '🐝', name: '蜂', w: 5,  desc: '+3点。盤面の🌱1つにつき +3点。隣の花（🌱🌸🌻🪷）1つにつき +1倍' },
  moon:   { e: '🌙', name: '月', w: 3,  desc: '倍率を×1.25。上下左右が全部埋まっていれば×1.5。後に発動するほど強い' },
  star:   { e: '⭐', name: '星', w: 3,  desc: '上下左右のタイルを もう一度発動させる。隣の⭐1つにつき 回数+1（星を固めるほど増える）' },
  mirror: { e: '🪞', name: '鏡', w: 3,  desc: '左隣のタイルと同じ効果で発動する' },
  // ── ラウンド3から出る（tier 2）──
  sakura: { e: '🌸', name: '桜', w: 4, tier: 2, desc: '+6点。周り8マス（斜めも）のタイルの種類1つにつき +2倍（いろいろ混ぜるほど強い）' },
  mush:   { e: '🍄', name: '茸', w: 4, tier: 2, desc: '盤面のタイル1枚につき +2点。庭が埋まるほど強い' },
  thunder:{ e: '⚡', name: '雷', w: 3, tier: 2, desc: '同じ縦の列のタイルを全部 もう一度発動させる。同じ列の⚡1つにつき 回数+1' },
  // ── ラウンド5から出る（tier 3）──
  rainbow:{ e: '🌈', name: '虹', w: 3, tier: 3, desc: '盤面のタイルの種類1つにつき 倍率を×0.2ずつ上乗せ（8種類なら×2.6）。ただし効くのは盤面で最初の🌈だけ' },
  // ── 庭ごとの専用タイル（only の庭でしか出ない）──
  lotus:  { e: '🪷', name: '蓮',   w: 5, tier: 2, from: 1, only: 'water', desc: '倍率を×1.5。隣の💧1つにつき さらに×0.25' },
  bamboo: { e: '🎋', name: '竹',   w: 5, tier: 2, from: 1, only: 'water', desc: '+6点と+3倍。さらに 倍率×1.16、置いてから経ったラウンド1つにつき ×0.16ずつ上乗せ（長く残すほど育つ）' },
  bigtree:{ e: '🌳', name: '大樹', w: 3, tier: 3, from: 3, only: 'water', desc: '盤面の「草」「水」のタイル（🌳以外）1つにつき 倍率×0.09ずつ上乗せ。さらに置いてから経ったラウンド1つにつき ×0.14（育てるほど掛け算が膨らむ）' },
  sprig:  { e: '🌿', name: '若葉', w: 0, born: true, desc: '+6点。隣の💧1つにつき +4点（🌱が2ラウンド残ると育つ。水辺の庭では さらに3ラウンドで🌳大樹に）' },
  sun:    { e: '☀️', name: '日',   w: 3, tier: 3, from: 3, only: 'water', desc: '盤面の🌱・💧・🪷を全部 もう一度発動させる' },
  lantern:{ e: '🏮', name: '提灯', w: 5, tier: 2, from: 1, only: 'fire',  desc: '盤面の🔥1つにつき +8点と+1倍、さらに 倍率×0.02ずつ上乗せ' },
  yam:    { e: '🍠', name: '焼き芋', w: 5, tier: 2, from: 1, only: 'fire', desc: 'いまの「熱」1つにつき +6点と+1倍。熱が8以上なら さらに倍率×1.3。熱は このラウンドで それまでに🔥が発動した回数（右下に置くほど熱い）' },
  volcano:{ e: '🌋', name: '火山', w: 5, tier: 3, from: 3, only: 'fire', desc: 'いまの熱1つにつき 倍率×0.14ずつ上乗せ（🔥をたくさん燃やした後ろに置くほど強い）' },
  dragon: { e: '🐉', name: '竜',   w: 5, tier: 3, from: 3, only: 'fire',  desc: '隣の🔥1つにつき 倍率を×1.8' },
  owl:    { e: '🦉', name: '梟',   w: 5, tier: 2, from: 1, only: 'night', desc: '+8点。斜め4方向のタイルを もう一度発動させる。斜めの⭐🦉1つにつき 回数+1' },
  scope:  { e: '🔭', name: '望遠鏡', w: 5, tier: 2, from: 1, only: 'night', desc: '同じ縦の列と横の列にある⭐1つにつき 倍率を×0.25ずつ上乗せ' },
  venus:  { e: '🌟', name: '明星', w: 3, tier: 3, from: 3, only: 'night', desc: '盤面の「天」のタイル（🌟以外）1つにつき 倍率×0.02ずつ上乗せ。同じ縦横の列にある「天」は さらに×0.03ずつ' },
  comet:  { e: '🌠', name: '流星', w: 3, tier: 3, from: 3, only: 'night', desc: '盤面の🌙を全部 もう一度発動させる' },
  sunflwr:{ e: '🌻', name: '向日葵', w: 6, tier: 2, from: 1, only: 'bee', desc: '+10点。隣の🐝と🌱1つにつき +5倍、さらに 倍率×0.4ずつ上乗せ（4つ囲めば ×2.6）' },
  nest:   { e: '🪺', name: '巣',   w: 5, tier: 2, from: 1, only: 'bee', desc: '隣の🐝の「群れ」（上下左右につながった🐝全部）1匹につき +6点と+3倍、さらに 倍率×0.25ずつ上乗せ' },

  return `<div class="slot">${miniBoard(d.board, true)}<div><div class="sn">枠 ${n + 1}　${THEMES[d.theme] ? THEMES[d.theme].name : ''}<span class="res ${r[1]}">${r[0]}</span></div>
    <div class="score">${fmt(d.score)} ${titleHtml(d.score)}</div>
    <div class="sd">ラウンド ${d.round + 1} / 8・遺物 ${d.relics.map(k => RELICS[k] ? RELICS[k].e : '').join('')}${d.mvp && d.mvp.length ? `<br>活躍 ${d.mvp.map(k => TILES[k] ? TILES[k].e : '').join(' ')}` : ''}<br>${fmtDate(d.at)}</div><div class="sb">${buttons}</div></div></div>`;
}
// メニューから見る記録の一覧
function recordList(msg) {
  const rows = Array.from({ length: SLOTS }, (_, n) => { const d = readSlot(n); return slotHtml(n, d, d ? `<button class="d" data-n="${n}">消す</button>` : ''); }).join('');
  modal(`<h2>庭の記録</h2><p class="lead">${msg || 'ゲームが終わったときの画面から、盤面と点数をここに残せる。'}</p>
    <div class="menu">${rows}<button class="choice" id="rcBack"><b>メニューに戻る</b></button></div>`);
  document.querySelectorAll('.slot .sb button.d').forEach(b => b.onclick = () => {
    const n = +b.dataset.n;
    modal(`<h2>消す？</h2><p class="lead">枠 ${n + 1} の記録を消す。元には戻せない。</p>
      <div class="menu"><button class="choice danger" id="ok"><b>消す</b></button><button class="choice" id="ng"><b>やめておく</b></button></div>`);
    $('ok').onclick = () => { writeSlot(n, null); recordList(`枠 ${n + 1} を消した。`); }; $('ng').onclick = () => recordList();
  });
  $('rcBack').onclick = openMenu;
}
// 終わった直後：どの枠に残すか選ぶ
let lastEnd = null;
function recordPick(msg) {
  const e = lastEnd;
  const rows = Array.from({ length: SLOTS }, (_, n) => {
    const d = readSlot(n);
    return slotHtml(n, d, `<button class="p" data-n="${n}">${d ? '上書きする' : 'ここに残す'}</button>`);
  }).join('');
  modal(`<h2>どの枠に残す？</h2><div style="display:flex;gap:12px;align-items:center;justify-content:center;margin:6px 0">${miniBoard(e.board, true)}<div><div class="big" style="font-size:28px;margin:0">${fmt(e.score)}</div><div class="sd" style="font-size:12px">${THEMES[e.theme].name}・${RESULT[e.result][0]}</div></div></div>
    <p class="lead">${msg || ''}</p><div class="menu">${rows}<button class="choice" id="rpBack"><b>もどる</b></button></div>`);
  document.querySelectorAll('.slot .sb button.p').forEach(b => b.onclick = () => {
    const n = +b.dataset.n, d = readSlot(n);
    const save = () => { const ok = writeSlot(n, Object.assign({}, e, { at: Date.now() })); if (ok) { e.saved = n; tone(660, 'triangle', .12, .08); } e.reopen(ok ? `枠 ${n + 1} に記録した。` : 'この環境では保存できなかった。'); };
    if (!d) return save();
    modal(`<h2>上書きする？</h2><p class="lead">枠 ${n + 1}（${fmt(d.score)}・${THEMES[d.theme] ? THEMES[d.theme].name : ''}）を消して、この庭を残す。</p>
      <div class="menu"><button class="choice danger" id="ok"><b>上書きする</b></button><button class="choice" id="ng"><b>やめておく</b></button></div>`);
    $('ok').onclick = save; $('ng').onclick = () => recordPick();
  });
  $('rpBack').onclick = () => e.reopen();
}
// 終了画面の下に「記録する」「もう一度」を並べる
// ===== ランキング（庭ごと・このブラウザに保存）=====
const RANK_KEY = 'rensa-rank-', RANK_N = 10;
function readRank(th) { try { return JSON.parse(localStorage.getItem(RANK_KEY + th)) || []; } catch (e) { return []; } }
function addRank(entry) {
  const list = readRank(entry.theme); list.push(entry);
  list.sort((a, b) => b.score - a.score || a.at - b.at);
  const pos = list.indexOf(entry);
  try { localStorage.setItem(RANK_KEY + entry.theme, JSON.stringify(list.slice(0, RANK_N))); } catch (e) {}
  return pos < RANK_N ? pos : -1;
}
function rankHtml(th, meAt) {
  const list = readRank(th);
  if (!list.length) return '<p class="lead">まだ記録がない。遊び終わると自動で載る。</p>';
  return `<div class="menu">${list.map((d, n) => {
    const r = RESULT[d.result] || RESULT.over;
    return `<div class="rk-row${meAt && d.id === meAt ? ' me' : ''}"><span class="rk-n${n < 3 ? ' g' + (n + 1) : ''}">${n + 1}</span>${miniBoard(d.board, false).replace('class="mini"', 'class="mini s"')}
      <span><span class="rk-s">${fmt(d.score)}</span> ${titleHtml(d.score)} <span class="res ${r[1]}" style="font-size:10px;font-weight:700;padding:1px 4px;border-radius:2px;background:${r[1] ? 'rgba(27,23,18,.12)' : 'var(--gold)'}">${r[0]}</span>
      <div class="rk-d">${d.mvp && d.mvp.length ? '活躍 ' + d.mvp.map(k => TILES[k] ? TILES[k].e : '').join('') + '・' : ''}遺物 ${d.relics.map(k => RELICS[k] ? RELICS[k].e : '').join('')}<br>${fmtDate(d.at)}</div></span></div>`;
  }).join('')}</div>`;
}
function rankingView(th, back, meAt) {
  const tabs = Object.keys(THEMES).map(k => `<button data-t="${k}" class="${k === th ? 'on' : ''}">${THEMES[k].e}${THEMES[k].name.replace('の庭', '')}</button>`).join('');
  modal(`<h2>🏆 ランキング</h2><div class="tabs">${tabs}</div><p class="lead" style="font-size:12px">${THEMES[th].name}・上位${RANK_N}件（このブラウザに保存）</p>${rankHtml(th, meAt)}
    <div class="menu" style="margin-top:10px"><button class="choice" id="rkBack"><b>${back === 'end' ? 'もどる' : 'メニューに戻る'}</b></button></div>`);
  $('modal').scrollTop = 0;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => rankingView(b.dataset.t, back, meAt));
  $('rkBack').onclick = () => back === 'end' ? lastEnd.reopen() : openMenu();
}
// ===== 桁の節目の演出 =====
function milePop(name) {
  const r = $('total').getBoundingClientRect(), d = document.createElement('div');
  d.className = 'mpop'; d.textContent = name + '！'; d.style.left = (r.left + r.width / 2 + (Math.random() * 120 - 60)) + 'px'; d.style.top = (r.top - 4) + 'px';
  document.body.appendChild(d);
  d.animate([{ transform: 'translate(-50%,0) scale(.6)', opacity: 0 }, { transform: 'translate(-50%,-16px) scale(1.2)', opacity: 1, offset: .3 }, { transform: 'translate(-50%,-44px) scale(1)', opacity: 0 }], { duration: 700 }).onfinish = () => d.remove();
  tone(880 + Math.random() * 300, 'triangle', .06, .05);
}
async function mileBanner(T) {
  const m = mileOf(T); if (!m || m[0] < 12) return;
  let first = false;
  try { const prev = +(localStorage.getItem('rensa-mile') || 0); if (m[0] > prev) { first = true; localStorage.setItem('rensa-mile', m[0]); } } catch (e) {}
  const big = m[0] >= 68, g = m[0] >= 100, el = $('mile');
  el.className = big ? 'big' : '';
  el.innerHTML = `<div class="mk">${m[1]}${g ? '到達！' : ' 突破！'}</div><div class="ms">${g ? '10の' + m[0] + '乗' : titleOf(T)}</div>${first ? '<div class="mf">初到達！</div>' : ''}`;
  const dur = big ? 2200 : 1300;
  el.animate([{ opacity: 0, transform: 'scale(.5)' }, { opacity: 1, transform: 'scale(1.1)', offset: .15 }, { opacity: 1, transform: 'scale(1)', offset: .8 }, { opacity: 0, transform: 'scale(1.05)' }], { duration: dur });
  if (big) {
    $('flashall').animate([{ opacity: 0 }, { opacity: 1, offset: .1 }, { opacity: 0 }], { duration: 1400 });
    burst(g ? 60 : 40);
    [0, 4, 7, 12, 16, 19, 24].forEach((st, j) => setTimeout(() => tone(note(12 + st), 'triangle', .3, .1), j * 80));
    if (!lightFx) kick($('app'), SHAKE, 400);
  } else {
    [0, 7, 12].forEach((st, j) => setTimeout(() => tone(note(10 + st), 'triangle', .2, .08), j * 90));
  }
  await sleep(big ? 1600 : 800);
}
// ===== いちばんの連鎖をスロー再生 =====
async function replayBest() {
  const b = S.bestReplay; if (!b) return;
  const keep = { board: S.board, ages: S.ages, dirs: S.dirs, levels: S.levels, relics: S.relics, round: S.round, fuse: S.fuse, busy: S.busy, hand: S.hand };
  Object.assign(S, { board: b.board.slice(), ages: b.ages.slice(), dirs: b.dirs.slice(), levels: (b.levels || []).slice(), relics: b.relics.slice(), round: b.round, fuse: { path: b.path.slice() }, busy: true, hand: [] });
  closeModal(); render(); drawFuse();
  info(`🎞️ ラウンド ${b.round + 1} の連鎖（${fmt(b.score)} 点）をスロー再生`);
  await sleep(700);
  await runScoring({ replay: true, bonus: b.bonus });
  const fl = $('fuseline'); if (fl) fl.remove();
  Object.assign(S, keep); render();
}
function endScreen(head, T, result) {
  S.over = true; clearSave();
  const rk = statRanking();
  lastEnd = { board: S.board.slice(), score: T, theme: S.theme, relics: S.relics.slice(), round: S.round, result, saved: null, mvp: rk.slice(0, 3).map(r => r.k) };
  const entry = { board: lastEnd.board, score: T, theme: S.theme, relics: lastEnd.relics, round: S.round, result, mvp: lastEnd.mvp, at: Date.now(), id: Date.now() + '-' + Math.random().toString(36).slice(2, 8) };
  const pos = addRank(entry); lastEnd.rankAt = entry.id;
  const rankLine = pos >= 0 ? `<div class="rk-me">🏆 ${THEMES[S.theme].name}ランキング ${pos + 1}位！</div>` : `<p style="text-align:center;font-size:12px;color:#5b5243">${THEMES[S.theme].name}ランキングの${RANK_N}位までには入らなかった</p>`;
  head = head.replace('<div class="big">', `<div style="text-align:center;margin-top:4px">${titleHtml(T)}</div><div class="big">`) + rankLine;
  lastEnd.reopen = msg => {
    modal(head + `${msg ? `<p style="text-align:center;font-weight:700;color:#c23b20">${msg}</p>` : ''}
      <div class="choices">
        <button class="choice" id="rec" style="text-align:center"${lastEnd.saved != null ? ' disabled' : ''}><b>${lastEnd.saved != null ? `📜 枠 ${lastEnd.saved + 1} に記録ずみ` : '📜 この庭を記録する'}</b></button>
        ${S.bestReplay ? `<button class="choice" id="replay" style="text-align:center"><b>🎞️ いちばんの連鎖をスロー再生</b><small style="display:block;font-size:11px;color:#5b5243">ラウンド ${S.bestReplay.round + 1}・${fmt(S.bestReplay.score)} 点</small></button>` : ''}
        <button class="choice" id="stat" style="text-align:center"><b>📊 活躍したタイルを見る</b></button>
        <button class="choice" id="rank" style="text-align:center"><b>🏆 ランキングを見る</b></button>
        <button class="choice" id="again" style="text-align:center"><b>もう一度あそぶ</b></button></div>`);
    $('rec').onclick = () => recordPick();
    if ($('replay')) $('replay').onclick = async () => { await replayBest(); lastEnd.reopen(); };
    $('rank').onclick = () => rankingView(lastEnd.theme, 'end', lastEnd.rankAt);
    $('stat').onclick = () => { modal(`<h2>活躍したタイル</h2>${statsHtml()}<div class="menu"><button class="choice" id="stBack"><b>もどる</b></button></div>`); $('modal').scrollTop = 0; $('stBack').onclick = () => lastEnd.reopen(); };
    $('again').onclick = () => { closeModal(); chooseTheme(); };
  };
  lastEnd.reopen();
}
function closeMenu() { menuOpen = false; if (inThemePick()) chooseTheme(); else closeModal(); }
function confirmRestart() {
  modal(`<h2>やり直す？</h2><p class="lead">いまの庭（ラウンド ${S.round + 1}）は消えて、庭を選ぶところに戻る。<br>最高スコアは残る。</p>
    <div class="menu"><button class="choice danger" id="rYes"><b>↺ やり直す</b></button><button class="choice" id="rNo"><b>やめておく</b></button></div>`);
  $('rYes').onclick = () => { menuOpen = false; tone(330, 'triangle', .12, .08); closeModal(); chooseTheme(); };
  $('rNo').onclick = openMenu;
}
function cardList(tab) {
  const mine = S.theme;
  const item = (k, t, extra = '') => {
    const off = t.only && mine && t.only !== mine;
    const cls = 'cl-i t' + (t.tier || 1) + (t.only && t.only === mine ? ' mine' : '') + (off ? ' off' : '');
    return `<div class="${cls}"><span class="ce">${t.e}</span><span><b>${t.name}</b> ${tagHtml(k)}${extra}<br>${t.desc}</span></div>`;
  };
  const when = k => tierOf(k) > 1 ? `<small style="margin-left:6px;color:#7a6f5c">ラウンド${startOf(k) + 1}から</small>` : '';
  const keys = Object.keys(TILES);
  const sec = (title, sub, list) => list.length ? `<div class="cl-h">${title}<small>${sub}</small></div><div class="cl">${list.join('')}</div>` : '';
  let body = '';
  if (tab === 'relic') {
    const ritem = ([k, r]) => {
      const has = S.relics.includes(k), start = Object.values(THEMES).find(t => t.relic === k), off = r.only && mine && r.only !== mine;
      return `<div class="cl-i${has ? ' mine' : ''}${off ? ' off' : ''}"><span class="ce">${r.e}</span><span><b>${r.name}</b>${has ? '<small style="margin-left:6px;color:#c23b20;font-weight:700">持っている</small>' : ''}${start ? `<small style="margin-left:6px;color:#7a6f5c">最初に持っている</small>` : ''}<br>${r.desc}</span></div>`;
    };
    const all = Object.entries(RELICS);
    const order = mine ? [mine, ...Object.keys(THEMES).filter(t => t !== mine)] : Object.keys(THEMES);
    body = sec('共通の遺物', 'どの庭でも出る', all.filter(([, r]) => !r.only).map(ritem))
      + order.map(th => sec(`${THEMES[th].name}の専用遺物`, th === mine ? 'いまの庭' : 'この庭でしか出ない', all.filter(([, r]) => r.only === th).map(ritem))).join('');
  } else {
    const showThemes = tab === 'mine' && mine ? [mine] : Object.keys(THEMES);
    body = sec('基本', '最初から出る', keys.filter(k => tierOf(k) === 1 && !TILES[k].born).map(k => item(k, TILES[k])))
      + sec('庭で生まれる', '手札には出ない。ラウンドの合間に庭が変わって生まれる', keys.filter(k => TILES[k].born).map(k => item(k, TILES[k])))
      + sec('上', 'ラウンド3から出る', keys.filter(k => tierOf(k) === 2 && !TILES[k].only).map(k => item(k, TILES[k])))
      + sec('極', 'ラウンド5から出る', keys.filter(k => tierOf(k) === 3 && !TILES[k].only).map(k => item(k, TILES[k])))
      + showThemes.map(th => sec(`${THEMES[th].name}の専用`, th === mine ? 'いまの庭' : 'この庭でしか出ない',
          keys.filter(k => TILES[k].only === th).map(k => item(k, TILES[k], `<small style="margin-left:6px;color:#7a6f5c">${tierOf(k) === 3 ? '極' : '上'}・ラウンド${startOf(k) + 1}から</small>`)))).join('');
  }
  const tabs = [mine ? ['mine', 'いまの庭'] : null, ['all', 'ぜんぶ'], ['relic', '遺物']].filter(Boolean);
  modal(`<h2>カード一覧</h2><div class="tabs">${tabs.map(([k, n]) => `<button data-t="${k}" class="${k === tab ? 'on' : ''}">${n}</button>`).join('')}</div>
    ${body}<div class="menu"><button class="choice" id="clBack"><b>メニューに戻る</b></button></div>`);
  $('modal').scrollTop = 0;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => cardList(b.dataset.t));
  $('clBack').onclick = openMenu;
}
$('menuBtn').onclick = () => { ensureAudio(); openMenu(); };
function toggleSound() { soundOn = !soundOn; $('soundBtn').textContent = soundOn ? '音 ON' : '音 OFF'; }
$('soundBtn').onclick = toggleSound;

// はじめて開いたとき：ようこそ画面（案内つきで始めるか選べる）
function welcome() {
  modal(`<h2>連鎖の庭へようこそ</h2><p class="lead">タイルを庭に置いて、<b>連鎖</b>で大きな点を出すゲーム。</p>
    <ol class="steps">
      <li>手札から<b>3枚</b>、5×5の庭に置く</li>
      <li><b>🔥点火</b>すると、タイルが順番に発動して <b>点 × 倍率</b> がスコアになる</li>
      <li><b>目標</b>を超えたらクリア。<b>遺物</b>（ずっと効くボーナス）を1つもらって次のラウンドへ</li>
      <li>タイルは残るので、ラウンドごとに庭が育って点がどんどん大きくなる。<b>全8ラウンド</b></li>
    </ol>
    <div class="choices">
      <button class="choice" id="wTut" style="text-align:center;border-color:var(--mult)"><b>🔰 案内つきで始める（おすすめ）</b><br><small>最初のゲームで、場面ごとに何をすればいいか教える</small></button>
      <button class="choice" id="wHelp" style="text-align:center"><b>📖 遊び方をくわしく読む</b></button>
      <button class="choice" id="wGo" style="text-align:center"><b>案内なしで始める</b></button>
    </div>`);
  $('wTut').onclick = () => { ensureAudio(); tutSet('on'); chooseTheme(); };
  $('wHelp').onclick = () => { ensureAudio(); help(true); };
  $('wGo').onclick = () => { ensureAudio(); tutSet('done'); chooseTheme(); };
}
statusTips();
let tutState = null; try { tutState = localStorage.getItem('rensa-tut'); } catch (e) {}
chooseTheme(); if (tutState == null && !clearedSet().size && !loadSave()) welcome();
queueFit(true);
</script>
